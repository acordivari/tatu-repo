# Netlify build for the React/Vite SPA in web/.
# Set VITE_API_URL in the Netlify dashboard (Site settings → Environment) to
# your Render API base, INCLUDING the version path, e.g.
#   https://api.findyourtatu.org/api/v1
# It's read at build time and inlined into the bundle.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# One public address. The site also answers on its original netlify.app name;
# send that to the real domain so there is a single origin to protect (and no
# duplicate copy for crawlers). Listed first: Netlify applies the first match.
# Deploy previews use other hostnames and are not affected.
[[redirects]]
  from = "https://tatu-repo1.netlify.app/*"
  to = "https://findyourtatu.org/:splat"
  status = 301
  force = true

# Client-side routing: serve index.html for any non-asset path so deep links
# like /shops/bangbangnyc work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page.
# - The CSP is enforcing: anything not allowed below is blocked, and the
#   browser console names the blocked URL and directive. If a new outside
#   source is added (a font, an analytics script, a new image host), add its
#   origin to the matching directive or it won't load. To debug a breakage
#   without blocking, temporarily rename the header to
#   Content-Security-Policy-Report-Only.
# - `frame-ancestors 'none'` is the modern anti-framing control;
#   X-Frame-Options stays for older browsers.
# - The /review page keeps ADMIN_TOKEN in sessionStorage, so script injection
#   is the main thing the CSP guards against.
# - Allowed origins: the API; R2 for artist images (signed URLs on the
#   account's r2.cloudflarestorage.com host — add R2_PUBLIC_BASE's host here if
#   that's ever set); MapTiler for the map style/tiles/glyphs; OpenStreetMap
#   tiles + MapLibre demo glyphs for the keyless fallback map; Google Fonts.
#   MapLibre runs its workers from blob: URLs.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: blob: https://*.r2.cloudflarestorage.com https://api.maptiler.com https://tile.openstreetmap.org; \
      connect-src 'self' https://api.findyourtatu.org https://api.maptiler.com https://demotiles.maplibre.org https://tile.openstreetmap.org; \
      worker-src 'self' blob:; \
      child-src blob:; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self'\
      """
