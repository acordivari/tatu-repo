# Dependency update pull requests, one grouped PR per ecosystem per week so the
# noise stays low. Security fixes are raised as soon as GitHub knows of them,
# provided "Dependabot security updates" is switched on in the repository
# settings (Settings → Advanced Security).
version: 2
updates:
  - package-ecosystem: bundler
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gems:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Ruby base image in api/Dockerfile (keep api/.ruby-version in step).
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
